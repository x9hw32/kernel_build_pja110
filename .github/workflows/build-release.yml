name: Build All Kernel Flavors & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty for auto-generated date tag)'
        required: false
        default: ''
      release_name:
        description: 'Release Title (optional)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.flavor.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        flavor:
          # --- BakaSU ---
          - id: bakasu-pure
            name: "BakaSU (Pure)"
            args: "--bakasu --no-susfs --no-zero --extras"
          - id: bakasu-susfs
            name: "BakaSU (SusFS)"
            args: "--bakasu --susfs --no-zero --extras"
          - id: bakasu-zero
            name: "BakaSU (ZeroMount)"
            args: "--bakasu --no-susfs --zero --extras"
          - id: bakasu-susfs-zero
            name: "BakaSU (SusFS + ZeroMount)"
            args: "--bakasu --susfs --zero --extras"

          # --- SukiSU-Ultra ---
          - id: sukisu-pure
            name: "SukiSU-Ultra (Pure)"
            args: "--sukisu --no-susfs --no-zero --extras"
          - id: sukisu-susfs
            name: "SukiSU-Ultra (SusFS)"
            args: "--sukisu --susfs --no-zero --extras"
          - id: sukisu-zero
            name: "SukiSU-Ultra (ZeroMount)"
            args: "--sukisu --no-susfs --zero --extras"
          - id: sukisu-susfs-zero
            name: "SukiSU-Ultra (SusFS + ZeroMount)"
            args: "--sukisu --susfs --zero --extras"

          # --- KernelSU-Next ---
          - id: ksun-pure
            name: "KernelSU-Next (Pure)"
            args: "--ksun --no-susfs --no-zero --extras"
          - id: ksun-susfs
            name: "KernelSU-Next (SusFS)"
            args: "--ksun --susfs --no-zero --extras"
          - id: ksun-zero
            name: "KernelSU-Next (ZeroMount)"
            args: "--ksun --no-susfs --zero --extras"
          - id: ksun-susfs-zero
            name: "KernelSU-Next (SusFS + ZeroMount)"
            args: "--ksun --susfs --zero --extras"

          # --- KernelSU-Official ---
          - id: ksu-pure
            name: "KernelSU-Official (Pure)"
            args: "--ksu --no-susfs --no-zero --extras"
          - id: ksu-susfs
            name: "KernelSU-Official (SusFS)"
            args: "--ksu --susfs --no-zero --extras"
          - id: ksu-zero
            name: "KernelSU-Official (ZeroMount)"
            args: "--ksu --no-susfs --zero --extras"
          - id: ksu-susfs-zero
            name: "KernelSU-Official (SusFS + ZeroMount)"
            args: "--ksu --susfs --zero --extras"

          # --- ReSukiSU ---
          - id: resuksu-pure
            name: "ReSukiSU (Pure)"
            args: "--resuksu --no-susfs --no-zero --extras"
          - id: resuksu-susfs
            name: "ReSukiSU (SusFS)"
            args: "--resuksu --susfs --no-zero --extras"
          - id: resuksu-zero
            name: "ReSukiSU (ZeroMount)"
            args: "--resuksu --no-susfs --zero --extras"
          - id: resuksu-susfs-zero
            name: "ReSukiSU (SusFS + ZeroMount)"
            args: "--resuksu --susfs --zero --extras"

          # --- YukiSU ---
          - id: yukisu-pure
            name: "YukiSU (Pure)"
            args: "--yukisu --no-susfs --no-zero --extras"
          - id: yukisu-susfs
            name: "YukiSU (SusFS)"
            args: "--yukisu --susfs --no-zero --extras"
          - id: yukisu-zero
            name: "YukiSU (ZeroMount)"
            args: "--yukisu --no-susfs --zero --extras"
          - id: yukisu-susfs-zero
            name: "YukiSU (SusFS + ZeroMount)"
            args: "--yukisu --susfs --zero --extras"

          # --- More-KernelSU ---
          - id: mksu-pure
            name: "More-KernelSU (Pure)"
            args: "--mksu --no-susfs --no-zero --extras"
          - id: mksu-susfs
            name: "More-KernelSU (SusFS)"
            args: "--mksu --susfs --no-zero --extras"
          - id: mksu-zero
            name: "More-KernelSU (ZeroMount)"
            args: "--mksu --no-susfs --zero --extras"
          - id: mksu-susfs-zero
            name: "More-KernelSU (SusFS + ZeroMount)"
            args: "--mksu --susfs --zero --extras"

          # --- Restricted-KernelSU (RKSU) ---
          - id: rksu-pure
            name: "Restricted-KernelSU (Pure)"
            args: "--rksu --no-susfs --no-zero --extras"
          - id: rksu-susfs
            name: "Restricted-KernelSU (SusFS)"
            args: "--rksu --susfs --no-zero --extras"
          - id: rksu-zero
            name: "Restricted-KernelSU (ZeroMount)"
            args: "--rksu --no-susfs --zero --extras"
          - id: rksu-susfs-zero
            name: "Restricted-KernelSU (SusFS + ZeroMount)"
            args: "--rksu --susfs --zero --extras"

          # --- KernelSU-Lite ---
          - id: ksulite-pure
            name: "KernelSU-Lite (Pure)"
            args: "--ksulite --no-susfs --no-zero --extras"
          - id: ksulite-susfs
            name: "KernelSU-Lite (SusFS)"
            args: "--ksulite --susfs --no-zero --extras"
          - id: ksulite-zero
            name: "KernelSU-Lite (ZeroMount)"
            args: "--ksulite --no-susfs --zero --extras"
          - id: ksulite-susfs-zero
            name: "KernelSU-Lite (SusFS + ZeroMount)"
            args: "--ksulite --susfs --zero --extras"

          # --- WildSU ---
          - id: wildsu-pure
            name: "WildSU (Pure)"
            args: "--wildsu --no-susfs --no-zero --extras"
          - id: wildsu-susfs
            name: "WildSU (SusFS)"
            args: "--wildsu --susfs --no-zero --extras"
          - id: wildsu-zero
            name: "WildSU (ZeroMount)"
            args: "--wildsu --no-susfs --zero --extras"
          - id: wildsu-susfs-zero
            name: "WildSU (SusFS + ZeroMount)"
            args: "--wildsu --susfs --zero --extras"

          # --- SakiSU ---
          - id: sakisu-pure
            name: "SakiSU (Pure)"
            args: "--sakisu --no-susfs --no-zero --extras"
          - id: sakisu-susfs
            name: "SakiSU (SusFS)"
            args: "--sakisu --susfs --no-zero --extras"
          - id: sakisu-zero
            name: "SakiSU (ZeroMount)"
            args: "--sakisu --no-susfs --zero --extras"
          - id: sakisu-susfs-zero
            name: "SakiSU (SusFS + ZeroMount)"
            args: "--sakisu --susfs --zero --extras"

          # --- ApexSU ---
          - id: apexsu-pure
            name: "ApexSU (Pure)"
            args: "--apexsu --no-susfs --no-zero --extras"
          - id: apexsu-susfs
            name: "ApexSU (SusFS)"
            args: "--apexsu --susfs --no-zero --extras"
          - id: apexsu-zero
            name: "ApexSU (ZeroMount)"
            args: "--apexsu --no-susfs --zero --extras"
          - id: apexsu-susfs-zero
            name: "ApexSU (SusFS + ZeroMount)"
            args: "--apexsu --susfs --zero --extras"

          # --- Stock Kernel ---
          - id: stock
            name: "Stock"
            args: "--stock --no-susfs --no-zero --extras"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev dwarves \
            python3 python-is-python3 zip curl git qemu-user binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu rsync kmod cpio lz4 zstd

      - name: Build Kernel (${{ matrix.flavor.name }})
        run: |
          chmod +x make.sh
          ./make.sh ${{ matrix.flavor.args }}

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          cp -v out_images/AnyKernel3-5.15.180-*.zip artifacts/ 2>/dev/null || true
          rm -f artifacts/AnyKernel3-latest.zip
          ls -la artifacts/

      - name: Upload Flavor Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.flavor.id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish All Kernels to Release
    needs: build
    if: always() && !cancelled() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts/

      - name: Organize Release Files
        run: |
          mkdir -p release_files
          find downloaded_artifacts/ -type f -name "AnyKernel3-*.zip" -exec cp -v {} release_files/ \;
          cd release_files
          ls -lh
          if [ -z "$(ls -A .)" ]; then
            echo "ERROR: No AnyKernel3 zip files found!"
            exit 1
          fi
          # Generate SHA256 Checksums
          sha256sum AnyKernel3-*.zip > sha256sums.txt
          cat sha256sums.txt

      - name: Determine Release Tag and Title
        id: rel_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="release-$(date +'%Y.%m.%d-%H%M')"
          fi

          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            TITLE="${{ github.event.inputs.release_name }}"
          else
            TITLE="OnePlus Ace 2 Pro (PJA110) All-Kernel Release (${TAG})"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.rel_info.outputs.tag }}
          name: ${{ steps.rel_info.outputs.title }}
          draft: false
          prerelease: false
          files: |
            release_files/*
          body: |
            ## OnePlus Ace 2 Pro (PJA110) Full Kernel Release
            
            Автоматическая сборка всех возможных 49 вариаций ядра Linux 5.15 (Android 13 GKI) для OnePlus Ace 2 Pro (`kalama` / SM8550).
            
            ### Вариации сборок в релизе:
            Для каждого из 12 поддерживаемых Root-решений собрано ровно 4 комбинации:
            1. **Чистый рут (Pure)** — без SusFS и ZeroMount.
            2. **Рут + SusFS v2.3.0** — скрытие рута через SusFS.
            3. **Рут + ZeroMount v2.0** — оверлейное монтирование модулей в обход детектов.
            4. **Рут + SusFS + ZeroMount** — связка для максимальной скрытности.
            
            Плюс чистая **Stock** сборка ядра (без рут-модификаций).
            
            #### Поддерживаемые рут-решения (12 вариантов):
            - **BakaSU**
            - **SukiSU-Ultra**
            - **KernelSU-Next**
            - **KernelSU-Official**
            - **ReSukiSU**
            - **YukiSU**
            - **More-KernelSU (MKSU)**
            - **Restricted-KernelSU (RKSU)**
            - **KernelSU-Lite**
            - **WildSU**
            - **SakiSU**
            - **ApexSU**
            
            ### Дополнительные возможности во всех сборках:
            - **`CONFIG_UDMABUF=y`** и **VirtIO драйверы** (аппаратная стабильность дисплея SM8550 и SurfaceFlinger)
            - **TCP BBR** (алгоритм контроля перегрузки сети от Google)
            - **NTFS3** (нативный высокоскоростной драйвер Paragon)
            - **Btrfs** (файловая система со сжатием и снапшотами)
            
            ### Инструкция по установке:
            1. Скачайте нужный архив `AnyKernel3-5.15.180-*.zip`.
            2. Прошейте через **KernelFlasher** (на работающей системе без перезагрузки в рекавери) или через **TWRP Recovery**.
            3. Контрольные суммы SHA-256 доступны в файле `sha256sums.txt`.
